taxonomy:
  allowed_topics:
    - name: "Política"
      scope: "Política nacional e internacional, legislación, geopolítica, diplomacia e instituciones públicas."
    - name: "Economía"
      scope: "Política monetaria y bancos centrales, operaciones corporativas de fusión y adquisición (M&A), regulación de mercados, industria, energía y tendencias macroeconómicas globales."
    - name: "Tecnología"
      scope: "Inteligencia artificial, desarrollo de software, hardware, ciberseguridad e impacto digital."
    - name: "Entretenimiento"
      scope: "Cine, series de televisión, estrenos y videojuegos con distribución o repercusión nacional o internacional. Excluir eventos o certámenes de circuito meramente local."
    - name: "Cultura"
      scope: "Arte, literatura, patrimonio histórico, arquitectura y pensamiento crítico con calado e impacto nacional o internacional. Excluir notas de agenda municipal o provincial."
    - name: "Fútbol"
      scope: "Competiciones oficiales, fichajes estratégicos y resultados relevantes. Excluir polémicas extradeportivas."
    - name: "Ciencias"
      scope: "Exploración espacial, física, descubrimientos empíricos, paleontología y biotecnología."
    - name: "Novelda"
      scope: "Actualidad municipal de Novelda: acuerdos plenarios, proyectos urbanos, servicios públicos, avisos municipales e hitos comunitarios destacados."

  strict_exclusions:
    - "Criptomonedas, activos digitales especulativos, tokens y blockchain financiera."
    - "Trading intradiario, análisis técnico bursátil, cotizaciones de divisas o variaciones porcentuales de mercado sin impacto corporativo o regulatorio estructural."
    - "Consejos de finanzas personales, microahorro, hipotecas domésticas o productos bancarios comerciales minoristas."
    - "Artículos de opinión, tribunas personales, editoriales y columnas subjetivas."
    - "Prensa rosa, celebridades, vida privada, cotilleos y realities."
    - "Consejos de estilo de vida, bienestar comercial, dietas milagro o pseudociencia."
    - "Sucesos menores de crónica negra sin impacto regulatorio o institucional relevante."

  boundary_rules:
    - instruction: "En Economía, descarta variaciones bursátiles intradiarias o análisis de cotizaciones sin operaciones corporativas o decisiones estructurales de fondo."
    - instruction: "En Cultura y Entretenimiento, descarta cualquier noticia sobre agenda local, ferias de libro municipales, exposiciones provinciales o nombramientos directivos de entidades subnacionales."
    - instruction: "Si una noticia de tecnología aborda cotizaciones o despidos financieros sin novedad de producto, descártala."
    - instruction: "Si una noticia sobre cine, series o entretenimiento aborda rumores o vida privada, descártala."
    - instruction: "Si una noticia de fútbol trata sobre discusiones personales o declaraciones extradeportivas, descártala."
    - instruction: "Si una noticia local de Novelda es una simple anécdota o trámite rutinario sin impacto municipal, descártala."