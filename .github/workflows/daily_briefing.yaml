name: Daily Morning Briefing

on:
  schedule:
    # 06:18 UTC -> 08:18 en España (horario de verano CEST) / 07:18 (horario de invierno CET)
    # El minuto :18 evita la saturación global de GitHub Actions en :00 y :15
    - cron: '18 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-briefing:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Validar ventana horaria matinal en España
        id: time_check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_run=true" >> $GITHUB_OUTPUT
            echo "Ejecución manual: omitiendo filtro horario."
            exit 0
          fi

          LOCAL_HOUR=$(TZ="Europe/Madrid" date +%H)
          echo "Hora detectada en Madrid: $LOCAL_HOUR"

          # Ventana matinal: permite la entrega si arranca entre las 08:00 y las 09:59
          if [ "$LOCAL_HOUR" -ge 8 ] && [ "$LOCAL_HOUR" -lt 10 ]; then
            echo "should_run=true" >> $GITHUB_OUTPUT
            echo "Ventana horaria matinal válida ($LOCAL_HOUR:XX). Procediendo con la entrega."
          else
            echo "should_run=false" >> $GITHUB_OUTPUT
            echo "Fuera de ventana matinal ($LOCAL_HOUR:XX). Omitiendo ejecución para evitar entregas a deshora."
          fi

      - name: Configurar entorno Python
        if: steps.time_check.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        if: steps.time_check.outputs.should_run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar Pipeline de Briefing Matinal
        if: steps.time_check.outputs.should_run == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python delivery.py

      - name: Registro mensual Keep-Alive (Día 1 de cada mes)
        if: steps.time_check.outputs.should_run == 'true'
        run: |
          CURRENT_DAY=$(TZ="Europe/Madrid" date +%d)
          if [ "$CURRENT_DAY" = "01" ]; then
            echo "Día 1 del mes: registrando actividad en log.txt."
            echo "Keep-alive ping: $(TZ='Europe/Madrid' date '+%Y-%m-%d %H:%M:%S %Z')" >> log.txt
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add log.txt
            git commit -m "chore(keep-alive): monthly activity ping [skip ci]"
            git push
          else
            echo "Día $CURRENT_DAY: no requiere registro de actividad hoy."
          fi