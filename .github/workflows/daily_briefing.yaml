name: Daily Morning Briefing

on:
  schedule:
    # Se programa a las 06:15 UTC y a las 07:15 UTC todos los días.
    # Uno de estos dos disparos siempre corresponderá exactamente a las 08:15 en España.
    - cron: '15 6,7 * * *'
  workflow_dispatch: # Permite ejecución manual de prueba en cualquier momento

jobs:
  run-briefing:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Validar hora local en España (Europe/Madrid)
        id: time_check
        run: |
          # Si se dispara manualmente por workflow_dispatch, ejecutar siempre
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_run=true" >> $GITHUB_OUTPUT
            echo "Ejecución manual solicitada: omitiendo filtro horario."
            exit 0
          fi

          # Obtener la hora actual en el huso horario peninsular
          LOCAL_HOUR=$(TZ="Europe/Madrid" date +%H)
          echo "Hora detectada en Madrid: $LOCAL_HOUR"

          if [ "$LOCAL_HOUR" -eq 8 ]; then
            echo "should_run=true" >> $GITHUB_OUTPUT
            echo "Ventana horaria correcta (08:XX en Madrid). Procediendo con la entrega."
          else
            echo "should_run=false" >> $GITHUB_OUTPUT
            echo "Hora fuera de la ventana objetivo de las 08:15 (Madrid: $LOCAL_HOUR:XX). Omitiendo ejecución."
          fi

      - name: Configurar entorno Python
        if: steps.time_check.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        if: steps.time_check.outputs.should_run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar Pipeline de Briefing Matinal
        if: steps.time_check.outputs.should_run == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python delivery.py