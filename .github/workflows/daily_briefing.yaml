name: Daily Morning Briefing

on:
  schedule:
    # 04:30 UTC -> 06:30 en España (verano CEST) / 05:30 (invierno CET)
    # Se ejecuta de madrugada sin atascos de servidor para estar listo al despertar
    - cron: '30 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-briefing:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar entorno Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar Pipeline de Briefing Matinal
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python delivery.py

      - name: Registro mensual Keep-Alive (Día 1 de cada mes)
        run: |
          CURRENT_DAY=$(TZ="Europe/Madrid" date +%d)
          if [ "$CURRENT_DAY" = "01" ]; then
            echo "Día 1 del mes: registrando actividad en log.txt."
            echo "Keep-alive ping: $(TZ='Europe/Madrid' date '+%Y-%m-%d %H:%M:%S %Z')" >> log.txt
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add log.txt
            git commit -m "chore(keep-alive): monthly activity ping [skip ci]"
            git push
          fi